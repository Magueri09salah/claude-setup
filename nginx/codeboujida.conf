# codeboujida.com — single origin, path-based routing.
#
#   /            -> redirect to /admin/
#   /admin/...   -> the admin panel (static Vite build, SPA fallback)
#   /api/...     -> the API on 127.0.0.1:4000, with the /api prefix STRIPPED
#   /legal/...   -> privacy policy (clean URL for the app stores)
#
# ============================================================================
# FIRST INSTALL ONLY. Do NOT copy this over a server that already has HTTPS.
# ============================================================================
# This file is port 80 only. certbot rewrites the LIVE config when it issues
# the certificate, adding `listen 443 ssl`, the ssl_certificate lines and the
# HTTP->HTTPS redirect. None of that is in here, so copying this file onto a
# running server SILENTLY DELETES HTTPS: `nginx -t` still passes (what is left
# is valid nginx), the reload succeeds, and then nothing answers on 443 --
# admin panel, API and the mobile app all go dark at once.
#
# To change the live config after the first install, EDIT IT IN PLACE:
#   sudo nano /etc/nginx/sites-available/codeboujida
# and mirror the change back into this file by hand.
#
# If you already clobbered it, put HTTPS back with:
#   sudo certbot --nginx -d codeboujida.com -d www.codeboujida.com
#   (choose "1: Attempt to reinstall this existing certificate")
#
# First install:
#   sudo cp nginx/codeboujida.conf /etc/nginx/sites-available/codeboujida
#   sudo ln -s /etc/nginx/sites-available/codeboujida /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d codeboujida.com -d www.codeboujida.com

server {
    listen 80;
    listen [::]:80;
    server_name codeboujida.com www.codeboujida.com;

    # Don't advertise the nginx version in headers and error pages.
    server_tokens off;

    # Video uploads are capped at 500MB in the API. nginx defaults to 1MB and
    # rejects anything larger with a 413 that never reaches the app — the panel
    # would show a generic error with nothing in the API log.
    client_max_body_size 512M;

    # ── Compression ─────────────────────────────────────────────────────────
    # Never gzip images, video or fonts: they are already compressed, and
    # gzipping them wastes CPU for no gain.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Security headers ────────────────────────────────────────────────────
    # `always` so they are sent on error responses too, not just 200s.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Legacy XSS auditor: 0 disables it. Modern browsers ignore this header, and
    # a value of 1 has known ways to be abused.
    add_header X-XSS-Protection "0" always;

    # ── API ─────────────────────────────────────────────────────────────────
    # The TRAILING SLASH on proxy_pass is what strips the /api prefix:
    #   /api/auth/login  ->  http://127.0.0.1:4000/auth/login
    # Remove that slash and every route 404s, because the app mounts its
    # routers at the root (/auth, /admin, /content, …).
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Required for the per-IP rate limit: without it the app sees every
        # request as coming from 127.0.0.1 and throttles all users as one.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long enough for a 500MB video upload on a slow connection.
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        client_body_timeout   600s;
        # Stream the body straight through instead of buffering the whole file
        # to disk first — a 500MB upload would otherwise be written twice.
        proxy_request_buffering off;
    }

    # ── Privacy policy ──────────────────────────────────────────────────────
    # Served by the API, but exposed here WITHOUT the /api prefix: this URL goes
    # into the Apple and Google store listings, so it must look permanent.
    #   https://codeboujida.com/legal/privacy.html
    location /legal/ {
        proxy_pass http://127.0.0.1:4000/legal/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Admin panel (static SPA) ────────────────────────────────────────────
    # Hashed filenames never change contents, so cache them for a year. This
    # block must come BEFORE the /admin/ block below.
    location /admin/assets/ {
        alias /var/www/codeboujida/admin/dist/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # try_files sends unknown paths to index.html so the React router can handle
    # them — this is what makes a refresh on /admin/users work instead of 404.
    location /admin/ {
        alias /var/www/codeboujida/admin/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;

        # index.html itself must never be cached, or browsers keep loading an
        # old build that points at asset files the new deploy deleted.
        location = /admin/index.html {
            add_header Cache-Control "no-store, must-revalidate" always;
        }
    }

    # /admin without the slash would otherwise 404 against the alias.
    location = /admin {
        return 301 /admin/;
    }

    # ── Root ────────────────────────────────────────────────────────────────
    # 302, not 301: browsers cache 301 permanently, which would trap you if a
    # public landing page is added here later.
    location = / {
        return 302 /admin/;
    }

    # ── AdMob authorised sellers ────────────────────────────────────────────
    # Ad exchanges fetch https://codeboujida.com/app-ads.txt -- the domain in the
    # Play listing's "Website" field -- to confirm this publisher may sell this
    # app's inventory. Without it a lot of demand simply refuses to bid, so the
    # ads fill badly and earn little.
    #
    # The publisher id is the digits inside the AdMob app id in mobile/app.json:
    # ca-app-pub-7655131518793372~... -> pub-7655131518793372. f08c47fec0942fa0
    # is Google's own identifier, the same for every publisher on earth. Both
    # are public by design — this file exists to be read by anyone.
    location = /app-ads.txt {
        default_type text/plain;
        return 200 "google.com, pub-7655131518793372, DIRECT, f08c47fec0942fa0\n";
    }

    # Everything else has no home on this domain.
    location / {
        return 404;
    }
}
